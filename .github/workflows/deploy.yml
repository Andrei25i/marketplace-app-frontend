name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Deploy to Render
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Trigger Render build and deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST "$DEPLOY_HOOK" -o /dev/null
          echo "Deploy triggered for commit $SHA"

  smoke-test:
    name: Smoke test production
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Wait for the new version to go live
        run: |
          for i in $(seq 1 90); do
            VERSION=$(curl -fsS "$APP_URL/version.json" | jq -r '.version' 2>/dev/null || true)
            echo "Attempt $i: live version = ${VERSION:-unknown}"
            if [ "$VERSION" = "$SHA" ]; then
              echo "New version is live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Version $SHA did not go live within 15 minutes"
          exit 1

      - name: Check pages and SPA routing
        run: |
          curl -fsS "$APP_URL/" -o /dev/null
          curl -fsS "$APP_URL/search" -o /dev/null
          echo "Home and /search respond"
